<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="author" content="{{ .Site.Params.author }}">

  <link rel="canonical" href="{{ .Permalink }}">

  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ .Site.Params.avatar | absURL }}">
  <meta name="twitter:card" content="summary">

  <meta name="theme-color" content="#f1eee5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0b" media="(prefers-color-scheme: dark)">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-icon-180x180.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="/index.xml">

  <link rel="stylesheet" href="/css/style.css">

  {{/* Applies a saved theme before first paint. Without it, dark-mode
       visitors get a flash of the light palette on every page load. */}}
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>

  <script defer src="/js/theme.js"></script>

  <script defer src="https://cloud.umami.is/script.js"
          data-website-id="9e39dd1c-91fa-410a-aa1f-a16b5bf6f7f2"></script>
</head>
