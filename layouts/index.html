{{ define "main" }}

{{ if .Content }}
<section class="homepage-content">
  {{ .Content }}
</section>
{{ end }}

<!-- Навыки и Языки в две колонки -->
<section class="two-columns">
  <!-- Левая колонка — Навыки -->
  <div>
    <h2>Навыки</h2>
    <div class="skills-list">
      <div><span class="icon si si-python"></span> Python</div>
      <div><span class="icon si si-sqlite"></span> SQL</div>
      <div><span class="icon si si-tensorflow"></span> Machine Learning</div>
      <div><span class="icon si si-docker"></span> Docker</div>
      <div><span class="icon si si-openai"></span> Agentic Development</div>
      <div><span class="icon si si-rag"></span> RAG</div>
      <div><span class="icon si si-apacheairflow"></span> ETL Pipelines</div>
    </div>
  </div>

  <!-- Правая колонка — Языки -->
  <div>
    <h2>Языки</h2>
    <div class="skills-list">
      <div><span class="icon fi fi-ru"></span> Русский (родной)</div>
      <div><span class="icon fi fi-gb"></span> English (C2)</div>
      <div><span class="icon fi fi-de"></span> Deutsch (B1)</div>
      <div><span class="icon fi fi-fr"></span> Français (B1)</div>
    </div>
  </div>
</section>

{{ end }}
