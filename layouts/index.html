{{ define "main" }}

{{ if .Content }}
<section class="homepage-content">
  {{ .Content }}
</section>
{{ end }}

<!-- Навыки и Языки в две колонки -->
<section class="two-columns">
  <!-- Левая колонка — Навыки -->
  <div>
    <h2>Навыки</h2>
    <div class="skills-list">
      <div><span class="icon"><i class="fab fa-python"></i></span> Python</div>
      <div><span class="icon"><i class="fas fa-database"></i></span> SQL</div>
      <div><span class="icon"><i class="fas fa-brain"></i></span> Machine Learning</div>
      <div><span class="icon"><i class="fab fa-docker"></i></span> Docker</div>
      <div><span class="icon"><i class="fas fa-robot"></i></span> Agentic Development</div>
      <div><span class="icon"><i class="fas fa-file-alt"></i></span> RAG</div>
      <div><span class="icon"><i class="fas fa-project-diagram"></i></span> ETL Pipelines</div>
    </div>
  </div>

<!-- Правая колонка — Языки -->
<div>
  <h2>Языки</h2>
  <div class="skills-list">
    <div><span class="icon flag-wrap"><span class="fi fi-ru"></span></span> Русский (родной)</div>
    <div><span class="icon flag-wrap"><span class="fi fi-gb"></span></span> English (C2)</div>
    <div><span class="icon flag-wrap"><span class="fi fi-de"></span></span> Deutsch (B1)</div>
    <div><span class="icon flag-wrap"><span class="fi fi-fr"></span></span> Français (B1)</div>
  </div>
</div>
</section>

{{ end }}
