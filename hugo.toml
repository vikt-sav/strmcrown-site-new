baseURL = "https://strmcrown.dev/"
locale = "ru"
defaultContentLanguage = "ru"
title = "strmcrown"

enableRobotsTXT = true
enableGitInfo = true

[pagination]
pagerSize = 10

[permalinks]
science = "/science/:slug/"
programs = "/programs/:slug/"
study = "/study/:slug/"
reading = "/reading/:slug/"
hacks-contests = "/hacks-contests/:slug/"

[taxonomies]
tag = "tags"
category = "categories"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "github-dark"
lineNos = false

[params]
author = "Viktor Savostyanov"
description = "Лингвист, преподающий перевод и исследующий LLM-системы: мультиагентная оценка машинного перевода, RAG, NLP."
avatar = "/avatar.jpg"

# ==================== ЯЗЫКИ ====================
# RU — основная версия (в корне), EN — машинный перевод DeepL (в /en/).
# Переводы контента генерирует scripts/translate.py в CI (см. .github/workflows/hugo.yml).

[languages]
  [languages.ru]
    weight = 1
    languageCode = "ru-RU"
    languageName = "RU"

  [languages.en]
    weight = 2
    languageCode = "en-US"
    languageName = "EN"

    [languages.en.params]
      description = "Linguist teaching translation and researching LLM systems: multi-agent MT evaluation, RAG, NLP."

# Меню определено через pageRef, чтобы Hugo сам подставлял префикс языка
# (/science/ для RU, /en/science/ для EN) и корректно работал подсветка
# активного пункта в header.html.

[[languages.ru.menu.main]]
name = "Наука"
pageRef = "/science/"
weight = 1

[[languages.ru.menu.main]]
name = "Программы"
pageRef = "/programs/"
weight = 2

[[languages.ru.menu.main]]
name = "Учёба"
pageRef = "/study/"
weight = 3

[[languages.ru.menu.main]]
name = "Чтение"
pageRef = "/reading/"
weight = 4

[[languages.ru.menu.main]]
name = "Конкурсы"
pageRef = "/hacks-contests/"
weight = 5

[[languages.ru.menu.main]]
name = "О сайте"
pageRef = "/about/"
weight = 6

[[languages.en.menu.main]]
name = "Science"
pageRef = "/science/"
weight = 1

[[languages.en.menu.main]]
name = "Programs"
pageRef = "/programs/"
weight = 2

[[languages.en.menu.main]]
name = "Study"
pageRef = "/study/"
weight = 3

[[languages.en.menu.main]]
name = "Reading"
pageRef = "/reading/"
weight = 4

[[languages.en.menu.main]]
name = "Contests"
pageRef = "/hacks-contests/"
weight = 5

[[languages.en.menu.main]]
name = "About"
pageRef = "/about/"
weight = 6