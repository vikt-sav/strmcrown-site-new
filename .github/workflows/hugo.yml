name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # enableGitInfo needs the full history to resolve each file's
          # last commit; the default shallow clone would mis-date files.
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned on purpose: 'latest' means an upstream Hugo release can
          # break the deploy with no change on our side.
          hugo-version: '0.164.0'
          extended: true

      # Regenerates *.en.md only for sources changed since the last run
      # (hash cache in .translation-cache.json), then commits the new
      # translations back so the next build skips the API for them.
      - name: Translate content (DeepL)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python3 scripts/translate.py content

      - name: Commit updated translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content .translation-cache.json
          if git diff --cached --quiet; then
            echo "Translations are up to date"
          else
            git commit -m "chore: refresh DeepL translations [skip ci]"
            git push
          fi

      - name: Build
        run: hugo --gc --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4